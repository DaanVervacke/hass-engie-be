# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Scope: pip and github-actions only.
#
# pre-commit is deliberately NOT configured. .pre-commit-config.yaml uses
# repo: local with language: system hooks that call .venv/bin/ruff, so the
# hook ruff always matches requirements.txt. There is no rev: for Dependabot
# to update. The pre-commit package itself is covered by pip below.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # mypy and ruff are listed FIRST on purpose. A dependency lands in
      # the first group it matches, so this keeps both isolated even if
      # the exclude-patterns below are ever dropped.
      #
      # Both gate CI, so a release that tightens either one must fail on
      # its own rather than reddening a batch and holding up bumps that
      # were perfectly fine. mypy gates via scripts/typecheck since plan
      # 099. ruff gates via the Lint workflow and is the worse offender:
      # .ruff.toml uses select = ["ALL"], so every rule ruff ever ships
      # is active on arrival. Ruff 0.16.0 proved this immediately by
      # promoting CPY001 and failing 108 test files.
      mypy:
        patterns:
          - "mypy"
      ruff:
        patterns:
          - "ruff"
      python-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "mypy"
          - "ruff"
    ignore:
      # homeassistant must match the homeassistant key in hacs.json, and
      # pytest-homeassistant-custom-component is pinned to a git ref that
      # Dependabot cannot bump. The two must move together, so bump both
      # by hand in one commit.
      - dependency-name: "homeassistant"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # hassfest is pinned to a master SHA by HA convention. That repo's
      # only tag is 1.0.0, so Dependabot would either re-pin to a stale
      # tag or chase master HEAD and pull unreviewed commits into CI.
      #
      # The trailing wildcard is required. Dependabot names this
      # dependency by its full action path, "home-assistant/actions/
      # hassfest", so a bare "home-assistant/actions" never matches and
      # the rule silently does nothing. The wildcard also covers any
      # sibling action pulled from that repo later.
      - dependency-name: "home-assistant/actions*"
