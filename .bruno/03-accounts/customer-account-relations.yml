info:
  name: Customer account relations
  type: http
  seq: 1
  tags:
  - data
  - live
http:
  method: GET
  url: '{{accountsBaseUrl}}/customer-account-relations?withBusinessAgreements=SMART_APP'
  params:
  - name: withBusinessAgreements
    value: SMART_APP
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      if (bru.getVar('ENGIE_BAN') || bru.getEnvVar('ENGIE_BAN')) {
        console.log('ENGIE_BAN already set, leaving it alone.');
      } else {
        const items = (res.getBody() || {}).items || [];
        const active = [];
        items.forEach(function (item) {
          const account = item.customerAccount || {};
          (account.businessAgreements || []).forEach(function (ba) {
            // Inactive agreements cannot be billed and _relations.py skips them.
            if (ba.active && ba.businessAgreementNumber) {
              active.push(ba.businessAgreementNumber);
            }
          });
        });

        if (active.length === 0) {
          console.log('No active business agreement found. Set ENGIE_BAN by hand.');
        } else {
          bru.setVar('ENGIE_BAN', active[0]);
          console.log('Seeded ENGIE_BAN from active agreement 1 of ' + active.length + '.');
        }
      }
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns accounts", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
        expect(value.length > 0 ? 'non-empty' : 'empty').to.equal('non-empty');
      });

      test("accounts carry a customerAccount", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.customerAccount); });
        expect(malformed.length).to.equal(0);
      });

      test("accounts carry businessAgreements", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.customerAccount && Array.isArray(i.customerAccount.businessAgreements)); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Every customer account this login can reach.

  Mirrors api.py::async_get_customer_account_relations. Run this FIRST: it is the only data request that does not need a BAN and it seeds ENGIE_BAN for the rest. withBusinessAgreements=SMART_APP is required, or the endpoint returns bare account identifiers with no business agreements and no consumption address.
