info:
  name: Usage details (history)
  type: http
  seq: 6
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsV2BaseUrl}}/business-agreements/{{ENGIE_BAN}}/usage-details?startDate={{usageStartDate}}&endDate={{usageEndDate}}&granularity=HOURLY&includeSimulation=true'
  params:
  - name: startDate
    value: '{{usageStartDate}}'
    type: query
  - name: endDate
    value: '{{usageEndDate}}'
    type: query
  - name: granularity
    value: HOURLY
    type: query
  - name: includeSimulation
    value: 'true'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      // Last 7 days, matching const.py::HISTORY_CHUNK_DAYS. startDate is
      // inclusive, endDate exclusive. Dates come from toISOString(), so the
      // boundaries are UTC days, not Brussels days.
      function isoDate(d) { return d.toISOString().slice(0, 10); }

      const end = new Date();
      const start = new Date(end.getTime() - 7 * 24 * 60 * 60 * 1000);

      bru.setVar('usageStartDate', isoDate(start));
      bru.setVar('usageEndDate', isoDate(end));
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.


      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns hourly rows", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
        expect(value.length > 0 ? 'non-empty' : 'empty').to.equal('non-empty');
      });

      test("rows carry start, end and energy", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.start && i.end && i.energy); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Hourly consumption, injection and gas. This is what the history
  import writes into long-term statistics.

  Mirrors api.py::async_get_usage_details.

  The window is the last 7 days, matching const.py::HISTORY_CHUNK_DAYS
  (168 hourly rows per response). startDate is inclusive, endDate
  exclusive.

  includeSimulation=true matches _statistics.py. Without it ENGIE
  scopes the response to the currently active contract, so a backfill
  across an earlier contract on the same BAN comes back empty. Any
  projected future rows it adds carry partialData true, and the
  converter drops them by comparing end against now rather than by
  filtering on that flag, because ENGIE also sets it on final rows
  from expired contracts.

  Parsed by _statistics.py: items[].{start,end}, then
  energy.electricity.{offtake,injection}.kWhSum and energy.gas.kWh,
  plus costs.electricity.{offtake,injection}.amountSum and costs.gas
  when costs are imported.
