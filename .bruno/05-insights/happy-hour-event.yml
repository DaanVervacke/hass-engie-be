info:
  name: Happy Hour event
  type: http
  seq: 2
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/happy-hour-event'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.


      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("any present window carries startTime and endTime", function () {
        const rows = [res.getBody().today, res.getBody().tomorrow].filter(function (w) { return w; }) || [];
        const malformed = rows.filter(function (w) { return !(w.startTime && w.endTime); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The upcoming Happy Hours free-energy window.

  Mirrors api.py::async_get_happy_hour_event.

  ENGIE_BAN must be the 12-digit businessAgreementNumber, NOT the shorter
  customerAccountNumber (CAN). The endpoint validates the length and
  returns HTTP 400 for anything else.

  Shapes seen in production: {} when nothing is scheduled, or a
  tomorrow key (announced the day before) and/or a today key (the
  same window re-published after midnight), each with startTime and
  endTime as ISO-8601 with explicit offsets.

  The API only ever exposes the next window, which is why store.py
  keeps a rolling archive of past ones.

  The endpoint is not gated on dynamic-tariff status, so the
  integration polls it for every active business agreement.
