info:
  name: Happy Hours month report
  type: http
  seq: 3
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/month-report/{{reportMonth}}'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      // Current month as YYYY-MM, which is the path format api.py builds.
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      bru.setVar('reportMonth', now.getFullYear() + '-' + month);
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.


      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a month block", function () {
        expect(typeof res.getBody().month === 'undefined' ? 'missing' : 'present').to.equal('present');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Current-month Happy Hours summary.

  Mirrors api.py::async_get_month_report.

  Path month is YYYY-MM, zero-padded, computed by the pre-request
  script.

  Only meaningful for BANs enrolled in Happy Hours. Un-enrolled BANs
  can get empty or zero values rather than an error, so the assertion
  checks only the envelope.

  The month.happyHour block carries the current-month summary:
  consumption, eligible hours, reward and comparison metrics. Read in
  coordinator.py and sensor.py. _happy_hour.py handles the event
  windows, not this report.
