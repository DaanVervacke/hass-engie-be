docs: |-
  Auth0 PKCE + MFA login, mirroring api.py::_run_auth_steps_1_to_7 and
  _run_auth_steps_8_to_13. Run 01-13 in order with the Local
  environment selected. Step 8 needs a real code, so set MFA_CODE
  between step 7 and step 8.

  Step 9 branches. See its docs: on the callback short-circuit, skip
  10-12 and go straight to 13.

  For email MFA instead of SMS, run 01-06, then the email-mfa folder,
  then rejoin at step 9.
