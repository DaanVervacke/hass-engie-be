info:
  name: ALT-2 Get login options
  type: http
  seq: 2
  tags:
  - auth
  - email
http:
  method: GET
  url: '{{authBaseUrl}}/u/mfa-login-options?state={{mfaChallengeState}}&ui_locales=nl'
  params:
  - name: state
    value: '{{mfaChallengeState}}'
    type: query
  - name: ui_locales
    value: nl
    type: query
  headers:
  - name: Accept
    value: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
  - name: User-Agent
    value: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36
  - name: sec-ch-ua
    value: '"Chromium";v="142", "Google Chrome";v="142", "Not_A Brand";v="99"'
  - name: sec-ch-ua-mobile
    value: ?1
  - name: sec-ch-ua-platform
    value: '"Android"'
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Email MFA ALT-2. Loads the factor picker.

  Mirrors api.py::_switch_to_email_mfa ALT-2.
