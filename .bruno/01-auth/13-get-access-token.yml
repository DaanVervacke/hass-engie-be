info:
  name: 13 Get access token
  type: http
  seq: 13
  tags:
  - auth
  - sms
  - email
  - token
http:
  method: POST
  url: '{{authBaseUrl}}/oauth/token'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/x-www-form-urlencoded
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  body:
    type: form-urlencoded
    data:
    - name: code
      value: '{{code}}'
    - name: grant_type
      value: authorization_code
    - name: redirect_uri
      value: be.engie.smart://login-callback/nl
    - name: code_verifier
      value: '{{code_verifier}}'
    - name: client_id
      value: '{{ENGIE_CLIENT_ID}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      const body = res.getBody();
      bru.setVar('accessToken', body.access_token);
      bru.setVar('refreshToken', body.refresh_token);
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.


      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns an access token", function () {
        expect(typeof res.getBody().access_token).to.equal('string');
      });

      test("returns a refresh token", function () {
        expect(typeof res.getBody().refresh_token).to.equal('string');
      });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Auth step 13. Exchanges the authorization code for tokens.

  Mirrors api.py::_run_auth_steps_8_to_13 step 13. Needs code_verifier
  from step 1, so the whole flow must run in one session.

  Sets: accessToken, refreshToken. Everything in folders 03-08 reads
  accessToken through the collection-level bearer auth.

  The access token stays valid for about 2 minutes, which is why the
  integration refreshes every 60 seconds
  (const.py::TOKEN_REFRESH_INTERVAL_SECONDS). Re-run
  02-token/Refresh token rather than the whole login when it
  expires.
