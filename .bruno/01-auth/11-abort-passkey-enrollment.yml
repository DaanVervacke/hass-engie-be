info:
  name: 11 Abort passkey enrollment
  type: http
  seq: 11
  tags:
  - auth
  - sms
  - email
http:
  method: POST
  url: '{{authBaseUrl}}/u/passkey-enrollment?state={{passKeyState}}&ui_locales=nl'
  params:
  - name: state
    value: '{{passKeyState}}'
    type: query
  - name: ui_locales
    value: nl
    type: query
  headers:
  - name: Accept
    value: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
  - name: User-Agent
    value: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36
  - name: sec-ch-ua
    value: '"Chromium";v="142", "Google Chrome";v="142", "Not_A Brand";v="99"'
  - name: sec-ch-ua-mobile
    value: ?1
  - name: sec-ch-ua-platform
    value: '"Android"'
  body:
    type: form-urlencoded
    data:
    - name: state
      value: '{{passKeyState}}'
    - name: action
      value: abort-passkey-enrollment
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Auth step 11. Outcome B only. Declines passkey enrollment.

  Mirrors api.py::_run_auth_steps_8_to_13 step 11. Redirects end at an app-scheme URL, so the code is picked up by step 12 instead.
