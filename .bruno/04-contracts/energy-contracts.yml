info:
  name: Energy contracts
  type: http
  seq: 1
  tags:
  - data
  - live
http:
  method: GET
  url: '{{businessAgreementsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/energy-contracts?filter=ONLY_ACTIVE_ENERGY_CONTRACTS&includeActions=true&includeSapData=true'
  params:
  - name: filter
    value: ONLY_ACTIVE_ENERGY_CONTRACTS
    type: query
  - name: includeActions
    value: 'true'
    type: query
  - name: includeSapData
    value: 'true'
    type: query
  headers:
  - name: User-Agent
    value: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      if (bru.getVar('ENGIE_EAN') || bru.getEnvVar('ENGIE_EAN')) {
        console.log('ENGIE_EAN already set, leaving it alone.');
      } else {
        const items = (res.getBody() || {}).items || [];
        const electricity = items.filter(function (c) {
          return c.status === 'ACTIVE' && c.division === 'ELECTRICITY' && c.servicePointNumber;
        });

        if (electricity.length === 0) {
          console.log('No active electricity contract found. Set ENGIE_EAN by hand.');
        } else {
          bru.setVar('ENGIE_EAN', electricity[0].servicePointNumber);
          console.log('Seeded ENGIE_EAN from electricity contract 1 of ' + electricity.length + '.');
        }
      }
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns contracts", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
        expect(value.length > 0 ? 'non-empty' : 'empty').to.equal('non-empty');
      });

      test("contracts carry division and servicePointNumber", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (c) { return !(c.division && c.servicePointNumber); });
        expect(malformed.length).to.equal(0);
      });

      test("contracts carry productConfiguration.energyProduct", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (c) { return !(c.productConfiguration && c.productConfiguration.energyProduct); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Active energy contracts, and the tariff product behind each.

  Mirrors api.py::async_get_energy_contracts. includeActions=true and includeSapData=true are load-bearing: without them productConfiguration is omitted, which is where energyProduct signals a DYNAMIC (EPEX-indexed) tariff. ENGIE_BAN must be the 12-digit businessAgreementNumber, not the shorter customerAccountNumber.
